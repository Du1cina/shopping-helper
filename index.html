<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>购物决策助手</title>
<style>
:root{--bg:#f5f4f0;--sf:#fff;--sf2:#f0efe9;--sf3:#e8e7e0;--bd:rgba(0,0,0,0.08);--bd2:rgba(0,0,0,0.13);--tx:#1a1916;--tx2:#6b6960;--tx3:#a09e96;--gn:#15803d;--gn-bg:#f0fdf4;--gn-bd:rgba(21,128,61,0.2);--rd:#b91c1c;--rd-bg:#fef2f2;--rd-bd:rgba(185,28,28,0.2);--am:#b45309;--am-bg:#fffbeb;--ac:#1d4ed8;--ac-bg:#eff6ff;--ac-tx:#1e40af;--r:10px;--rs:6px;--sh:0 1px 3px rgba(0,0,0,0.07);}
@media(prefers-color-scheme:dark){:root{--bg:#0f0f0e;--sf:#1a1a18;--sf2:#232320;--sf3:#2c2c28;--bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.13);--tx:#e8e6df;--tx2:#9e9c94;--tx3:#6b6960;--gn:#4ade80;--gn-bg:#052e16;--gn-bd:rgba(74,222,128,0.2);--rd:#f87171;--rd-bg:#2d0a0a;--rd-bd:rgba(248,113,113,0.2);--am:#fbbf24;--am-bg:#2d1d02;--ac:#60a5fa;--ac-bg:#1e3a5f;--ac-tx:#93c5fd;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;line-height:1.6;min-height:100vh;}
.app{max-width:820px;margin:0 auto;padding:0 16px 100px;}
header{padding:20px 0 16px;border-bottom:1px solid var(--bd);margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
header h1{font-size:16px;font-weight:700;}
header p{font-size:11px;color:var(--tx3);margin-top:2px;}
.badge{font-size:11px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx2);padding:3px 9px;border-radius:20px;}
.tabs{display:flex;gap:2px;background:var(--sf2);border-radius:var(--r);padding:3px;margin-bottom:18px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:56px;padding:7px 8px;font-size:12px;font-weight:500;border:none;background:none;color:var(--tx2);border-radius:7px;cursor:pointer;transition:all .15s;white-space:nowrap;text-align:center;font-family:inherit;}
.tab.active{background:var(--sf);color:var(--tx);box-shadow:var(--sh);}
.tab:hover:not(.active){color:var(--tx);}
.section{display:none;}.section.active{display:block;}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.card.hl{border-color:var(--gn);border-width:1.5px;}
.card-sm{padding:12px 14px;}
label{font-size:12px;color:var(--tx2);font-weight:500;display:block;margin-bottom:5px;}
select,input[type=text],input[type=number],input[type=url],textarea{width:100%;padding:8px 10px;font-size:13px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sf);color:var(--tx);font-family:inherit;transition:border .15s;}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--ac);}
textarea{resize:vertical;min-height:52px;}
.g{display:grid;gap:10px;margin-bottom:12px;}
.g2{grid-template-columns:1fr 1fr;}
.g3{grid-template-columns:1fr 1fr 1fr;}
.g4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr;}.g4{grid-template-columns:1fr 1fr;}}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;font-size:13px;font-weight:500;border-radius:var(--rs);border:1px solid var(--bd2);background:var(--sf);color:var(--tx);cursor:pointer;transition:all .15s;font-family:inherit;}
.btn:hover{background:var(--sf2);}
.btn-p{background:var(--tx);color:var(--bg);border-color:var(--tx);}
.btn-p:hover{opacity:.82;}
.btn-d{color:var(--rd);border-color:var(--rd-bd);}
.btn-d:hover{background:var(--rd-bg);}
.btn-sm{padding:5px 10px;font-size:12px;}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;}
.tag-best{background:var(--gn-bg);color:var(--gn);}
.tag-val{background:var(--ac-bg);color:var(--ac-tx);}
.tag-perf{background:var(--am-bg);color:var(--am);}
.tag-on{background:var(--gn-bg);color:var(--gn);}
.tag-soon{background:var(--am-bg);color:var(--am);}
.tag-off{background:var(--sf3);color:var(--tx3);}
.srow{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.slbl{font-size:11px;color:var(--tx2);width:62px;flex-shrink:0;}
.bbg{flex:1;height:4px;background:var(--sf2);border-radius:2px;overflow:hidden;}
.bfill{height:100%;border-radius:2px;transition:width .4s;}
.snum{font-size:11px;font-weight:600;width:22px;text-align:right;color:var(--tx2);}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.pchip{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx2);}
.pchip.low{background:var(--gn-bg);border-color:var(--gn-bd);color:var(--gn);font-weight:600;}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.met{background:var(--sf2);border-radius:var(--rs);padding:10px 12px;text-align:center;}
.met-v{font-size:20px;font-weight:700;}
.met-l{font-size:11px;color:var(--tx3);margin-top:1px;}
.verd{border-radius:var(--r);padding:14px 16px;margin-top:12px;}
.verd-y{background:var(--gn-bg);border:1px solid var(--gn-bd);}
.verd-n{background:var(--rd-bg);border:1px solid var(--rd-bd);}
.verd-t{font-size:15px;font-weight:700;margin-bottom:4px;}
.verd-y .verd-t{color:var(--gn);}
.verd-n .verd-t{color:var(--rd);}
.verd-b{font-size:13px;line-height:1.7;}
.verd-y .verd-b{color:var(--gn);}
.verd-n .verd-b{color:var(--rd);}
.reason{background:var(--sf2);border-radius:var(--rs);padding:10px 12px;margin-top:10px;font-size:12px;color:var(--tx2);line-height:1.8;}
.cmp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.cmp-t{width:100%;border-collapse:collapse;font-size:12px;min-width:460px;}
.cmp-t th{text-align:left;padding:9px 10px;font-weight:600;font-size:11px;color:var(--tx3);border-bottom:1px solid var(--bd);background:var(--sf2);white-space:nowrap;}
.cmp-t td{padding:9px 10px;border-bottom:1px solid var(--bd);vertical-align:middle;}
.cmp-t tr:last-child td{border-bottom:none;}
.cmp-t tr.tr-top td{background:color-mix(in srgb,var(--gn-bg) 40%,transparent);}
.bv{color:var(--gn);font-weight:700;}
.pref-row{margin-bottom:16px;}
.ph{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
.ph span:last-child{font-weight:700;color:var(--tx2);}
input[type=range]{width:100%;accent-color:var(--ac);cursor:pointer;}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.preset{padding:6px 12px;font-size:12px;border-radius:20px;border:1px solid var(--bd2);background:var(--sf2);color:var(--tx2);cursor:pointer;transition:all .15s;font-family:inherit;}
.preset:hover,.preset.active{background:var(--tx);color:var(--bg);border-color:var(--tx);}
.mo{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;}
.mo.hidden{display:none;}
.mo-box{background:var(--sf);border-radius:var(--r);padding:20px;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
.mo-box h2{font-size:15px;font-weight:700;margin-bottom:3px;}
.mo-sub{font-size:12px;color:var(--tx3);margin-bottom:16px;}
.mo-sec{font-size:12px;font-weight:600;color:var(--tx2);margin:14px 0 10px;padding-top:14px;border-top:1px solid var(--bd);}
.mo-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--bd);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
.hint{font-size:11px;color:var(--tx3);line-height:1.6;margin-top:4px;}
.stitle{font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:12px;}
.empty{text-align:center;padding:40px 20px;color:var(--tx3);font-size:13px;}
.irow{display:flex;justify-content:space-between;align-items:center;background:var(--sf2);border-radius:var(--rs);padding:10px 12px;margin-bottom:8px;gap:8px;}
.iname{font-size:13px;font-weight:500;}
.imeta{font-size:11px;color:var(--tx3);margin-top:2px;}
.iacts{display:flex;gap:6px;flex-shrink:0;}
.score-preview{background:var(--gn-bg);border:1px solid var(--gn-bd);border-radius:var(--rs);padding:10px 12px;margin-top:10px;font-size:12px;color:var(--gn);line-height:1.9;}
hr{border:none;border-top:1px solid var(--bd);margin:14px 0;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div><h1>🛍 购物决策助手</h1><p>最适合你 · 是否值得升级</p></div>
    <span class="badge" id="item-count">0 件商品</span>
  </header>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('rec',this)">推荐</button>
    <button class="tab" onclick="switchTab('cmp',this)">对比</button>
    <button class="tab" onclick="switchTab('upg',this)">升级分析</button>
    <button class="tab" onclick="switchTab('prc',this)">比价</button>
    <button class="tab" onclick="switchTab('prf',this)">我的偏好</button>
    <button class="tab" onclick="switchTab('adm',this)">管理商品</button>
  </div>

  <div class="section active" id="tab-rec">
    <div class="card card-sm">
      <div class="g g3">
        <div><label>品类</label><select id="rec-cat" onchange="renderRec()"></select></div>
        <div><label>预算上限（元）</label><input type="number" id="rec-budget" value="1000" min="50" step="100" oninput="renderRec()"></div>
        <div style="display:flex;align-items:flex-end"><p class="hint">系统自动匹配最适合你的三款</p></div>
      </div>
    </div>
    <div id="rec-out"></div>
  </div>

  <div class="section" id="tab-cmp">
    <div class="card card-sm" style="margin-bottom:14px">
      <div><label>品类</label><select id="cmp-cat" onchange="renderCmp()"></select></div>
    </div>
    <div id="cmp-out"></div>
  </div>

  <div class="section" id="tab-upg">
    <div class="card card-sm" style="margin-bottom:14px">
      <div class="g g2" style="margin-bottom:10px">
        <div><label>品类</label><select id="upg-cat" onchange="fillUpgSelects()"></select></div>
      </div>
      <div class="g g2" style="margin-bottom:10px">
        <div><label>我现在用的</label><select id="upg-from" onchange="renderUpg()"></select></div>
        <div><label>想换到</label><select id="upg-to" onchange="renderUpg()"></select></div>
      </div>
      <div>
        <label>值得升级阈值（分/千元）</label>
        <input type="number" id="upg-thresh" value="0.05" min="0.001" step="0.01" style="width:110px" oninput="renderUpg()">
        <p class="hint">每多花 1000 元综合分需提升至少这么多才算值得</p>
      </div>
    </div>
    <div id="upg-out"></div>
  </div>

  <div class="section" id="tab-prc">
    <div class="card card-sm" style="margin-bottom:14px">
      <div><label>品类</label><select id="prc-cat" onchange="renderPrc()"></select></div>
    </div>
    <div id="prc-out"></div>
  </div>

  <div class="section" id="tab-prf">
    <div class="card">
      <p style="font-size:13px;color:var(--tx2);margin-bottom:12px">选择偏好模式，或手动调整各维度权重：</p>
      <div class="presets" id="presets-wrap"></div>
      <div id="prf-sliders"></div>
      <hr>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="resetPrefs()">恢复默认</button>
        <button class="btn btn-p" onclick="savePrefs()">保存偏好</button>
      </div>
    </div>
    <div class="card card-sm" style="margin-top:4px">
      <p class="stitle">算法说明</p>
      <p style="font-size:12px;color:var(--tx2);line-height:1.9">
        <b>自动评分</b>：填入官网客观参数，系统按品类规则换算为 0–10 分，无需手动打分。<br>
        <b>综合评分</b> = Σ(维度分 × 偏好权重) ÷ 权重总和 ÷ 价格效用因子<br>
        <b>升级价值</b> = 综合分差 ÷ |价格差| × 1000（分/千元）
      </p>
    </div>
  </div>

  <div class="section" id="tab-adm">
    <div class="card card-sm" style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div><p style="font-size:13px;font-weight:600">商品库</p><p class="hint">数据存本地浏览器，换设备请先导出备份</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="exportData()">导出备份</button>
        <button class="btn btn-sm" onclick="document.getElementById('imp-file').click()">导入恢复</button>
        <input type="file" id="imp-file" accept=".json" style="display:none" onchange="importData(this)">
        <button class="btn btn-p btn-sm" onclick="openAdd()">＋ 添加商品</button>
      </div>
    </div>
    <div id="adm-out"></div>
  </div>
</div>

<!-- Modal -->
<div class="mo hidden" id="modal">
  <div class="mo-box">
    <h2 id="mo-title">添加商品</h2>
    <p class="mo-sub">填入官网参数，系统自动计算各维度评分</p>
    <div class="g g2">
      <div><label>商品名称 *</label><input type="text" id="f-name" placeholder="如：Decathlon UPF50+防晒衣"></div>
      <div><label>品类 *</label>
        <select id="f-cat" onchange="buildParamFields()">
          <option>公路车</option>
          <option>意式浓缩机</option>
          <option>全自动咖啡机</option>
          <option>手冲/滴滤机</option>
          <option>防晒衣</option>
        </select>
      </div>
    </div>
    <div class="g g3">
      <div><label>价格（元）*</label><input type="number" id="f-price" placeholder="299" min="1" oninput="updatePreview()"></div>
      <div><label>状态</label>
        <select id="f-status"><option value="active">在售</option><option value="eol-soon">即将停产</option><option value="eol">已停产</option></select>
      </div>
      <div><label>图片链接（可选）</label><input type="url" id="f-img" placeholder="https://..."></div>
    </div>
    <div style="margin-bottom:10px"><label>备注</label><textarea id="f-note" placeholder="使用感受、特色等"></textarea></div>
    <p class="mo-sec">各平台价格（可选）</p>
    <div class="g g4">
      <div><label>京东</label><input type="number" id="fp-jd" placeholder="—" min="0"></div>
      <div><label>淘宝</label><input type="number" id="fp-tb" placeholder="—" min="0"></div>
      <div><label>拼多多</label><input type="number" id="fp-pdd" placeholder="—" min="0"></div>
      <div><label>抖音商城</label><input type="number" id="fp-dy" placeholder="—" min="0"></div>
    </div>
    <p class="mo-sec">品类参数 <span style="font-weight:400;color:var(--tx3)">— 不知道可留空，系统用中间值处理</span></p>
    <div id="param-fields"></div>
    <div id="score-preview" style="display:none" class="score-preview"></div>
    <div class="mo-ft">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-p" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── SCHEMAS ──────────────────────────────────────────────────────
const SCHEMAS = {

  '公路车': {
    dims: ['性能','轻量','耐用性','性价比'],
    colors: {'性能':'#15803d','轻量':'#1d4ed8','耐用性':'#b45309','性价比':'#db2777'},
    weightKeys: {'性能':'perf','轻量':'portable','耐用性':'quality','性价比':'value'},
    params: [
      {key:'weight', label:'整车重量（kg）', ph:'8.5', hint:'越轻越好，竞赛车约7kg，入门约10kg'},
      {key:'gears', label:'变速总级数', ph:'22', hint:'如11速×2盘=22；越多通常越好'},
      {key:'frame', label:'车架材质', type:'sel', opts:['碳纤维','铝合金（高端）','铝合金（标准）','钢']},
      {key:'groupset', label:'套件等级', type:'sel', opts:['Dura-Ace/Red','Ultegra/Force','105/Rival','Tiagra/Claris','入门/无品牌'], hint:'变速系统等级'},
      {key:'wheelset', label:'轮组等级', type:'sel', opts:['碳纤维轮组','铝合金高端','铝合金标准','入门轮组']},
    ],
    score(p, price) {
      const gsS={'Dura-Ace/Red':10,'Ultegra/Force':8,'105/Rival':6.5,'Tiagra/Claris':5,'入门/无品牌':3};
      const frS={'碳纤维':10,'铝合金（高端）':7,'铝合金（标准）':5,'钢':3};
      const wlS={'碳纤维轮组':9,'铝合金高端':7,'铝合金标准':5,'入门轮组':3};
      const gs=gsS[p.groupset]??5, fr=frS[p.frame]??5, wl=wlS[p.wheelset]??5;
      const gearS=p.gears?Math.min(10,(p.gears-14)/18*10):5;
      const perf=gs*0.6+gearS*0.4;
      const weightS=p.weight?Math.max(0,Math.min(10,(11-p.weight)/4*10)):5;
      const light=weightS*0.5+fr*0.3+wl*0.2;
      const dur=Math.min(10,fr*0.5+gs*0.3+wl*0.2);
      const raw=(perf+light+dur)/3;
      const pf=Math.log10((price||3000)/1000+1)*4;
      const val=Math.min(10,raw/pf*3);
      return {'性能':+perf.toFixed(1),'轻量':+light.toFixed(1),'耐用性':+dur.toFixed(1),'性价比':+val.toFixed(1)};
    }
  },

  '意式浓缩机': {
    dims: ['萃取质量','功能性','易用性','性价比'],
    colors: {'萃取质量':'#15803d','功能性':'#b45309','易用性','#6d28d9','易用性':'#6d28d9','性价比':'#db2777'},
    weightKeys: {'萃取质量':'perf','功能性':'quality','易用性':'quality','性价比':'value'},
    params: [
      {key:'pressure', label:'最大压力（bar）', ph:'15', hint:'9bar是标准，15bar以上更常见'},
      {key:'boiler', label:'锅炉类型', type:'sel', opts:['双锅炉','热交换锅炉','单锅炉（大）','单锅炉（小）'], hint:'双锅炉可同时萃取+蒸奶'},
      {key:'pid', label:'PID精准控温', type:'sel', opts:['有','无'], hint:'有PID温度更稳定'},
      {key:'grinder', label:'内置磨豆机', type:'sel', opts:['有（锥刀）','有（平刀）','无']},
      {key:'preinfusion', label:'预浸泡', type:'sel', opts:['自动','手动','无'], hint:'预浸泡让萃取更均匀'},
      {key:'steam', label:'蒸汽棒', type:'sel', opts:['专业蒸汽棒','自动奶泡','Panarello棒','无']},
    ],
    score(p, price) {
      const blrS={'双锅炉':10,'热交换锅炉':7.5,'单锅炉（大）':5.5,'单锅炉（小）':3.5};
      const pidS={'有':10,'无':5};
      const preS={'自动':10,'手动':7,'无':4};
      const grS={'有（锥刀）':10,'有（平刀）':8,'无':3};
      const stS={'专业蒸汽棒':10,'自动奶泡':7,'Panarello棒':5,'无':2};
      const pressS=p.pressure?Math.min(10,3+(p.pressure-9)*0.7):6;
      const ext=(blrS[p.boiler]??5)*0.35+(pidS[p.pid]??7)*0.3+pressS*0.2+(preS[p.preinfusion]??4)*0.15;
      const func=(grS[p.grinder]??3)*0.4+(stS[p.steam]??5)*0.3+(preS[p.preinfusion]??4)*0.3;
      const ease=Math.min(10,4+(grS[p.grinder]??3===3?0:2)+(blrS[p.boiler]??5>7?1:0));
      const raw=(ext+func+ease)/3;

// ── SCORING ──────────────────────────────────────────────────────
function schema(cat){return SCHEMAS[cat]||SCHEMAS['公路车'];}
function autoScore(item){return schema(item.cat).score(item.params||{},item.price);}
function dimW(dimLabel){const k=DIM_KEY_MAP[dimLabel]||'perf';return W[k]||5;}
function finalScore(item){
  const sc=autoScore(item);
  const dims=Object.keys(sc);
  let ws=0,wsc=0;
  dims.forEach(d=>{const w=dimW(d);ws+=w;wsc+=sc[d]*w;});
  const raw=wsc/ws;
  const pf=Math.log10(item.price/1000+1)*1.5+1;
  return+(raw/pf*2.5).toFixed(2);
}
function lowPrice(item){if(!item.prices)return null;const v=Object.values(item.prices).filter(x=>x&&x>0);return v.length?Math.min(...v):null;}

}

function bars(item){

function renderRec(){
  fillSel('rec-cat');
  const cat=document.getElementById('rec-cat').value;
  const budget=+document.getElementById('rec-budget').value;
  const pool=byCat(cat).filter(i=>i.price<=budget*1.2&&i.status!=='eol');
  const el=document.getElementById('rec-out');
  if(!pool.length){el.innerHTML='<div class="empty">预算内暂无商品，请提高预算或在「管理商品」添加</div>';return;}
  const sc=pool.map(i=>({...i,_f:finalScore(i)})).sort((a,b)=>b._f-a._f);
  const sch=schema(cat);
  const perfDim=sch.dims[0];
  const bestPerf=[...pool].sort((a,b)=>(autoScore(b)[perfDim]||0)-(autoScore(a)[perfDim]||0))[0];
  const bestVal=[...pool].sort((a,b)=>{
    const sa=autoScore(a),sb=autoScore(b);
    const avg=s=>Object.values(s).reduce((x,y)=>x+y,0)/Object.values(s).length;
    return avg(sb)/b.price-avg(sa)/a.price;
  })[0];
  const picks=[];const seen=new Set();
  const add=(item,tag,cls,reason)=>{if(!seen.has(item.id)){seen.add(item.id);picks.push({item,tag,cls,reason});}};
  add(sc[0],'最适合你','tag-best',`综合你的偏好权重评分最高（${sc[0]._f}/10），最符合你的需求。`);
  add(bestVal,'性价比最高','tag-val','每元获得的综合评分最高，花最少的钱得到最多。');
  add(bestPerf,perfDim+'最强','tag-perf',`${perfDim}评分 ${(autoScore(bestPerf)[perfDim]||0)}/10，该品类这项指标最强。`);
  el.innerHTML=picks.map(({item,tag,cls,reason})=>`
    <div class="card ${tag==='最适合你'?'hl':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:12px;flex-wrap:wrap">

            <span style="font-size:15px;font-weight:700">${item.name}</span>
            <span class="tag ${cls}">${tag}</span>${stag(item.status)}
          </div>
          <div style="font-size:20px;font-weight:700">¥${item.price.toLocaleString()}</div>
          ${chips(item)}
          ${item.updated?`<div style="font-size:11px;color:var(--tx3);margin-top:4px">价格更新：${item.updated}</div>`:''}
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:28px;font-weight:800;color:${tag==='最适合你'?'var(--gn)':'var(--tx)'}">${finalScore(item)}</div>
          <div style="font-size:11px;color:var(--tx3)">综合评分</div>
        </div>
      </div>
      ${bars(item)}
      <div class="reason">${reason}${item.note?'<br><span style="color:var(--tx3)">💬 '+item.note+'</span>':''}</div>
    </div>`).join('');
}

function renderUpg(){
  const pool=byCat(document.getElementById('upg-cat').value);
  const fi=+document.getElementById('upg-from').value,ti=+document.getElementById('upg-to').value;
  const thr=+document.getElementById('upg-thresh').value;
  const el=document.getElementById('upg-out');
  if(fi===ti||!pool[fi]||!pool[ti]){el.innerHTML='<div class="empty">请选择两款不同商品</div>';return;}
  const fr=pool[fi],to=pool[ti];
  const fs=finalScore(fr),ts=finalScore(to);
  const pd=to.price-fr.price,sd=+(ts-fs).toFixed(2);
  const p1k=pd!==0?+(sd/Math.abs(pd)*1000).toFixed(3):null;
  const isUp=pd>0;
  const worth=isUp?(sd>0.2&&p1k>=thr):(sd>=-0.1);
  let txt='';
  if(isUp){
    if(sd<=0)txt=`多花 ¥${Math.abs(pd).toLocaleString()} 但综合评分${sd<0?'反而降低 '+Math.abs(sd)+' 分':'持平'}，不划算。`;
    else if(!worth)txt=`每多花 1000 元仅提升 ${p1k} 分，低于阈值 ${thr}，提升感不明显。`;
    else txt=`每多花 1000 元提升 ${p1k} 分，超过阈值 ${thr}，升级物有所值。`;
  }else{
    if(sd>=0)txt=`少花 ¥${Math.abs(pd).toLocaleString()} 综合分不降反升，强烈推荐。`;
    else txt=`少花 ¥${Math.abs(pd).toLocaleString()}，综合分小降 ${Math.abs(sd)} 分，根据预算自行取舍。`;
  }
  el.innerHTML=`<div class="card">
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:130px;background:var(--sf2);border-radius:var(--rs);padding:10px 12px">
        <div style="font-size:11px;color:var(--tx3);margin-bottom:3px">现有</div>
        <div style="font-size:13px;font-weight:600">${fr.name}</div>
        <div style="font-size:18px;font-weight:700;margin-top:2px">¥${fr.price.toLocaleString()}</div>
        <div style="font-size:13px;color:var(--tx2);margin-top:4px">综合分 <b>${fs}</b></div>
      </div>
      <div style="display:flex;align-items:center;font-size:20px;color:var(--tx3)">→</div>
      <div style="flex:1;min-width:130px;background:var(--sf2);border-radius:var(--rs);padding:10px 12px">
        <div style="font-size:11px;color:var(--tx3);margin-bottom:3px">目标</div>
        <div style="font-size:13px;font-weight:600">${to.name}</div>
        <div style="font-size:18px;font-weight:700;margin-top:2px">¥${to.price.toLocaleString()}</div>
        <div style="font-size:13px;color:var(--tx2);margin-top:4px">综合分 <b>${ts}</b></div>
      </div>
    </div>
    <div class="mets">
      <div class="met"><div class="met-v" style="color:${pd>0?'var(--rd)':'var(--gn)'}">${pd>0?'+':''}¥${Math.abs(pd).toLocaleString()}</div><div class="met-l">价格差</div></div>
      <div class="met"><div class="met-v" style="color:${sd>=0?'var(--gn)':'var(--rd)'}">${sd>=0?'+':''}${sd}</div><div class="met-l">评分差</div></div>
      <div class="met"><div class="met-v" style="font-size:16px">${p1k!==null?(p1k>0?'+':'')+p1k:'—'}</div><div class="met-l">分/千元</div></div>
    </div>
    <div class="verd ${worth?'verd-y':'verd-n'}">
      <div class="verd-t">${worth?'✅ 值得':'❌ 不建议'}</div>
      <div class="verd-b">${txt}</div>
    </div>
    <div class="reason">阈值：每千元需提升 ≥ ${thr} 分才算"值得"，可在上方调整。</div>
  </div>`;
}

// ── PRICES ────────────────────────────────────────────────────────
function renderPrc(){
  fillSel('prc-cat');
  const cat=document.getElementById('prc-cat').value;
  const pool=byCat(cat);
  const el=document.getElementById('prc-out');
  if(!pool.length){el.innerHTML='<div class="empty">该品类暂无商品</div>';return;}
  el.innerHTML=pool.map(item=>{
    const lp=lowPrice(item);
    const has=item.prices&&Object.values(item.prices).some(v=>v&&v>0);
    return`<div class="card card-sm">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:${has?'10':'0'}px">
        <div><span style="font-size:14px;font-weight:600">${item.name}</span> ${stag(item.status)}</div>
        ${lp?`<div style="text-align:right"><div style="font-size:11px;color:var(--tx3)">最低价</div><div style="font-size:18px;font-weight:700;color:var(--gn)">¥${lp.toLocaleString()}</div></div>`:''}
      </div>
      ${has?`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        ${Object.entries(PLAT).map(([k,l])=>{const v=item.prices[k];if(!v||v<=0)return`<div style="background:var(--sf2);border-radius:var(--rs);padding:8px;text-align:center"><div style="font-size:11px;color:var(--tx3)">${l}</div><div style="color:var(--tx3);font-size:13px;margin-top:2px">—</div></div>`;const low=v===lp;return`<div style="background:${low?'var(--gn-bg)':'var(--sf2)'};border:1px solid ${low?'var(--gn-bd)':'var(--bd)'};border-radius:var(--rs);padding:8px;text-align:center"><div style="font-size:11px;color:${low?'var(--gn)':'var(--tx3)'};font-weight:${low?700:400}">${l}${low?' ★':''}</div><div style="font-size:14px;font-weight:700;color:${low?'var(--gn)':'var(--tx)'};margin-top:2px">¥${v.toLocaleString()}</div></div>`;}).join('')}
      </div>`:'<p class="hint">未录入各平台价格，在「管理商品」中编辑添加。</p>'}
      ${item.updated?`<p class="hint" style="margin-top:8px">更新：${item.updated}</p>`:''}
    </div>`;
  }).join('');
}

// ── PREFS ─────────────────────────────────────────────────────────
function renderPrefs(){
  document.getElementById('presets-wrap').innerHTML=PRESETS.map((p,i)=>`<button class="preset" onclick="applyPreset(${i},this)">${p.label}</button>`).join('');
  document.getElementById('prf-sliders').innerHTML=Object.entries(W_LABELS).map(([k,l])=>`
    <div class="pref-row">
      <div class="ph"><span>${l}</span><span id="wv-${k}">${W[k]}</span></div>
      <input type="range" min="1" max="10" step="1" value="${W[k]}" oninput="W['${k}']=+this.value;document.getElementById('wv-${k}').textContent=this.value">
    </div>`).join('');
}
function applyPreset(i,btn){
  document.querySelectorAll('.preset').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  W={...PRESETS[i].w};saveW(W);renderPrefs();btn.classList.add('active');
  toast('已应用「'+PRESETS[i].label+'」✓');
}
function savePrefs(){saveW(W);toast('偏好已保存 ✓');}
function resetPrefs(){W={...DEF_W};saveW(W);renderPrefs();toast('已恢复默认');}

// ── ADMIN ─────────────────────────────────────────────────────────
function renderAdm(){
  const cats=getCats(),el=document.getElementById('adm-out');
  if(!items.length){el.innerHTML='<div class="empty">暂无商品，点击「添加商品」开始</div>';return;}
  el.innerHTML=cats.map(cat=>`<div class="card" style="margin-bottom:12px">
    <p class="stitle">${cat} <span style="font-weight:400;color:var(--tx3)">(${byCat(cat).length})</span></p>
    ${byCat(cat).map(item=>`<div class="irow">
      <div><div class="iname">${item.name} ${stag(item.status)}</div>
      <div class="imeta">¥${item.price.toLocaleString()} · 综合分 ${finalScore(item)} · ${item.updated||'未更新'}</div></div>
      <div class="iacts">
        <button class="btn btn-sm" onclick="openEdit('${item.id}')">编辑</button>
        <button class="btn btn-sm btn-d" onclick="delItem('${item.id}')">删除</button>
      </div>
    </div>`).join('')}
  </div>`).join('');
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────
function exportData(){
  const b=new Blob([JSON.stringify({items,weights:W},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='shopping-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('备份已下载 ✓');
}
function importData(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.items&&Array.isArray(d.items)){items=d.items;saveItems(items);}if(d.weights){W=d.weights;saveW(W);renderPrefs();}updCount();renderAdm();fillAll();renderRec();toast('导入成功 ✓');}catch{toast('文件格式错误');}};
  r.readAsText(f);input.value='';
}

// ── MODAL ─────────────────────────────────────────────────────────
let editId=null;

function buildParamFields(){
  const cat=document.getElementById('f-cat').value;
  const sch=schema(cat);
  document.getElementById('param-fields').innerHTML=sch.params.map(p=>`
    <div style="margin-bottom:10px">
      <label>${p.label}</label>
      ${p.type==='sel'
        ?`<select id="fp-${p.key}"><option value="">— 不知道 —</option>${p.opts.map(o=>`<option>${o}</option>`).join('')}</select>`
        :`<input type="number" id="fp-${p.key}" placeholder="${p.ph||''}" min="0" oninput="updatePreview()">`}
      ${p.hint?`<p class="hint">${p.hint}</p>`:''}
    </div>`).join('');
  sch.params.filter(p=>p.type==='sel').forEach(p=>{
    document.getElementById('fp-'+p.key).addEventListener('change',updatePreview);
  });
  updatePreview();
}

function updatePreview(){
  const cat=document.getElementById('f-cat').value;
  const price=+document.getElementById('f-price').value||1000;
  const sch=schema(cat);
  const params={};
  sch.params.forEach(p=>{
    const el=document.getElementById('fp-'+p.key);
    if(!el)return;
    const v=p.type==='sel'?el.value:+el.value;
    if(v&&v!=='')params[p.key]=v;
  });
  const scores=sch.score(params,price);
  const pv=document.getElementById('score-preview');
  pv.style.display='block';
  pv.innerHTML='<b>自动计算评分预览：</b> '+Object.entries(scores).map(([k,v])=>`${k} <b>${v}</b>`).join(' · ');
}

function openAdd(){
  editId=null;
  document.getElementById('mo-title').textContent='添加商品';
  ['f-name','f-img','f-note'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-price').value='';
  document.getElementById('f-status').value='active';
  document.getElementById('f-cat').value='防晒衣';
  ['jd','tb','pdd','dy'].forEach(k=>{const el=document.getElementById('fp-'+k);if(el)el.value='';});
  buildParamFields();
  document.getElementById('modal').classList.remove('hidden');
}
function openEdit(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  editId=id;
  document.getElementById('mo-title').textContent='编辑商品';
  document.getElementById('f-name').value=item.name;
  document.getElementById('f-cat').value=item.cat;
  document.getElementById('f-price').value=item.price;
  document.getElementById('f-status').value=item.status||'active';
  document.getElementById('f-img').value=item.img||'';
  document.getElementById('f-note').value=item.note||'';
  ['jd','tb','pdd','dy'].forEach(k=>{const el=document.getElementById('fp-'+k);if(el)el.value=item.prices&&item.prices[k]?item.prices[k]:'';});
  buildParamFields();
  // fill param values
  const sch=schema(item.cat);
  sch.params.forEach(p=>{
    const el=document.getElementById('fp-'+p.key);
    if(el&&item.params&&item.params[p.key]!=null)el.value=item.params[p.key];
  });
  updatePreview();
  document.getElementById('modal').classList.remove('hidden');
}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function saveItem(){
  const name=document.getElementById('f-name').value.trim();
  const cat=document.getElementById('f-cat').value;
  const price=+document.getElementById('f-price').value;
  if(!name||!price){toast('请填写名称和价格');return;}
  const sch=schema(cat);
  const params={};
  sch.params.forEach(p=>{
    const el=document.getElementById('fp-'+p.key);if(!el)return;
    const v=p.type==='sel'?el.value:+el.value;
    if(v&&v!=='')params[p.key]=p.type==='sel'?v:v;
  });
  const prices={};
  ['jd','tb','pdd','dy'].forEach(k=>{const el=document.getElementById('fp-'+k);if(el){const v=+el.value;prices[k]=v||null;}});
  const now=new Date();
  const updated=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const rec={name,cat,price,status:document.getElementById('f-status').value,img:document.getElementById('f-img').value.trim(),note:document.getElementById('f-note').value.trim(),params,prices,updated};
  if(editId){const idx=items.findIndex(i=>i.id===editId);if(idx>=0)items[idx]={...items[idx],...rec};}
  else items.push({id:'u'+Date.now(),...rec});
  saveItems(items);updCount();closeModal();renderAdm();
  toast(editId?'已更新 ✓':'已添加 ✓');
}
function delItem(id){if(!confirm('确认删除？'))return;items=items.filter(i=>i.id!==id);saveItems(items);updCount();renderAdm();toast('已删除');}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

function switchTab(id,btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');btn.classList.add('active');
  if(id==='rec'){fillSel('rec-cat');renderRec();}
  if(id==='cmp'){fillSel('cmp-cat');renderCmp();}
  if(id==='upg'){fillSel('upg-cat');fillUpgSelects();}
  if(id==='prc'){fillSel('prc-cat');renderPrc();}
  if(id==='adm')renderAdm();
}

// Init
fillAll();renderPrefs();renderRec();updCount();
</script>
</body>
</html>
